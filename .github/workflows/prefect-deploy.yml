name: Deploy to Prefect Cloud

on:
  push:
    branches: [main]
    paths:
      - prefect.yaml
      - src/flows.py
      - pyproject.toml
      - uv.lock

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Generate requirements-prefect.txt
        run: uv export --no-dev --frozen --no-hashes --no-emit-project -o requirements-prefect.txt

      - name: Commit requirements-prefect.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements-prefect.txt
          git diff --cached --quiet || git commit -m "update requirements-prefect.txt"
          git push

      - name: Install Prefect
        run: pip install prefect

      - name: Deploy flows
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: prefect deploy --all
